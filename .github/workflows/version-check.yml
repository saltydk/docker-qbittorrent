name: version-check

on:
  workflow_dispatch:
  schedule:
    - cron:  '0 */6 * * *'

jobs:
  find-latest-release:
    runs-on: ubuntu-latest
    outputs:
      qbt-libtorrent2-version: ${{ steps.set-latest-libtorrent2-version.outputs.qbt-libtorrent2-version }}
      qbt-libtorrent1-version: ${{ steps.set-latest-libtorrent1-version.outputs.qbt-libtorrent1-version }}
      qbt-legacy-version: ${{ steps.set-latest-legacy-version.outputs.qbt-legacy-version }}
      qbt-legacy-revision: ${{ steps.set-latest-legacy-revision.outputs.qbt-legacy-revision }}
      qbt-latest-revision: ${{ steps.set-latest-revision.outputs.qbt-latest-revision }}

    steps:
      - name: Check GitHub API rate limits
        run: |
          response=$(curl -s -I https://api.github.com/rate_limit)
          remaining=$(echo "$response" | grep -i "x-ratelimit-remaining" | cut -d: -f2 | tr -d ' \r')
          if [ -n "$remaining" ] && [ "$remaining" -lt 10 ]; then
            echo "::warning::GitHub API rate limit is low: $remaining requests remaining"
          fi

      - name: Download and verify dependency versions
        id: download-versions
        run: |
          main_deps_url="https://github.com/userdocs/qbittorrent-nox-static/releases/latest/download/dependency-version.json"
          legacy_deps_url="https://github.com/userdocs/qbittorrent-nox-static-legacy/releases/latest/download/dependency-version.json"
          
          # Function to download and validate JSON
          download_and_validate() {
            local url=$1
            local max_retries=3
            local retry_count=0
            
            while [ $retry_count -lt $max_retries ]; do
              response=$(curl -sL --retry 3 --retry-delay 5 "$url")
              if [ $? -eq 0 ] && echo "$response" | jq empty > /dev/null 2>&1; then
                echo "$response"
                return 0
              fi
              retry_count=$((retry_count + 1))
              sleep 5
            done
            return 1
          }
          
          # Download and validate main dependency file
          main_deps=$(download_and_validate "$main_deps_url")
          if [ $? -ne 0 ]; then
            echo "::error::Failed to download or parse main dependency version file"
            exit 1
          fi
          echo "MAIN_DEPS=$main_deps" >> $GITHUB_ENV
          
          # Download and validate legacy dependency file
          legacy_deps=$(download_and_validate "$legacy_deps_url")
          if [ $? -ne 0 ]; then
            echo "::error::Failed to download or parse legacy dependency version file"
            exit 1
          fi
          echo "LEGACY_DEPS=$legacy_deps" >> $GITHUB_ENV

      - name: Set libtorrent2 version
        id: set-latest-libtorrent2-version
        run: |
          version=$(echo "$MAIN_DEPS" | jq -r '. | "release-\(.qbittorrent)_v\(.libtorrent_2_0)"')
          if [ -z "$version" ] || [ "$version" = "release-_v" ]; then
            echo "::error::Failed to extract libtorrent2 version"
            exit 1
          fi
          echo "qbt-libtorrent2-version=$version" >> $GITHUB_OUTPUT

      - name: Set libtorrent1 version
        id: set-latest-libtorrent1-version
        run: |
          version=$(echo "$MAIN_DEPS" | jq -r '. | "release-\(.qbittorrent)_v\(.libtorrent_1_2)"')
          if [ -z "$version" ] || [ "$version" = "release-_v" ]; then
            echo "::error::Failed to extract libtorrent1 version"
            exit 1
          fi
          echo "qbt-libtorrent1-version=$version" >> $GITHUB_OUTPUT

      - name: Set legacy version
        id: set-latest-legacy-version
        run: |
          version=$(echo "$LEGACY_DEPS" | jq -r '. | "release-\(.qbittorrent)_v\(.libtorrent_1_2)"')
          if [ -z "$version" ] || [ "$version" = "release-_v" ]; then
            echo "::error::Failed to extract legacy version"
            exit 1
          fi
          echo "qbt-legacy-version=$version" >> $GITHUB_OUTPUT

      - name: Set legacy revision
        id: set-latest-legacy-revision
        run: |
          revision=$(echo "$LEGACY_DEPS" | jq -r '.revision')
          if [ -z "$revision" ] || [ "$revision" = "null" ]; then
            echo "::error::Failed to extract legacy revision"
            exit 1
          fi
          echo "qbt-legacy-revision=$revision" >> $GITHUB_OUTPUT

      - name: Set latest revision
        id: set-latest-revision
        run: |
          revision=$(echo "$MAIN_DEPS" | jq -r '.revision')
          if [ -z "$revision" ] || [ "$revision" = "null" ]; then
            echo "::error::Failed to extract latest revision"
            exit 1
          fi
          echo "qbt-latest-revision=$revision" >> $GITHUB_OUTPUT

  update-libtorrent2:
    runs-on: ubuntu-latest
    needs: find-latest-release
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false # otherwise, the token used is the GITHUB_TOKEN, instead of your personal access token.
        fetch-depth: 0 # otherwise, there would be errors pushing refs to the destination repository.
        ref: libtorrent2
    - name: Create local changes
      run: |
        [ ! -z "$QBT_VERSION" ] && [[ "$QBT_VERSION" != "null" ]] && sed -i 's/.*ARG QBITTORRENT_RELEASE=.*/ARG QBITTORRENT_RELEASE="'${QBT_VERSION}'"/' Dockerfile
      env:
        QBT_VERSION: ${{ needs.find-latest-release.outputs.qbt-libtorrent2-version }}
    - name: Create local changes
      run: |
        [ ! -z "$QBT_REVISION" ] && [[ "$QBT_REVISION" != "null" ]] && sed -i 's/.*ARG QBITTORRENT_REVISION=.*/ARG QBITTORRENT_REVISION="'${QBT_REVISION}'"/' Dockerfile
      env:
        QBT_REVISION: ${{ needs.find-latest-release.outputs.qbt-latest-revision }}
    - name: Commit files
      run: |
        git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git commit -m "Update to ${{ needs.find-latest-release.outputs.qbt-libtorrent2-version }}-${{ needs.find-latest-release.outputs.qbt-latest-revision }}" -a || echo "Nothing to update"
    - name: Push changes
      uses: ad-m/github-push-action@master
      with:
        github_token: ${{ secrets.GH_TOKEN }}
        branch: libtorrent2

  update-libtorrent1:
    runs-on: ubuntu-latest
    needs: find-latest-release
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false # otherwise, the token used is the GITHUB_TOKEN, instead of your personal access token.
        fetch-depth: 0 # otherwise, there would be errors pushing refs to the destination repository.
        ref: libtorrent1
    - name: Create local changes
      run: |
        [ ! -z "$QBT_LIBTORRENT1_VERSION" ] && [[ "$QBT_LIBTORRENT1_VERSION" != "null" ]] && sed -i 's/.*ARG QBITTORRENT_RELEASE=.*/ARG QBITTORRENT_RELEASE="'${QBT_LIBTORRENT1_VERSION}'"/' Dockerfile
      env:
        QBT_LIBTORRENT1_VERSION: ${{ needs.find-latest-release.outputs.qbt-libtorrent1-version }}
    - name: Create local changes
      run: |
        [ ! -z "$QBT_REVISION" ] && [[ "$QBT_REVISION" != "null" ]] && sed -i 's/.*ARG QBITTORRENT_REVISION=.*/ARG QBITTORRENT_REVISION="'${QBT_REVISION}'"/' Dockerfile
      env:
        QBT_REVISION: ${{ needs.find-latest-release.outputs.qbt-latest-revision }}
    - name: Commit files
      run: |
        git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git commit -m "Update to ${{ needs.find-latest-release.outputs.qbt-libtorrent1-version }}-${{ needs.find-latest-release.outputs.qbt-latest-revision }}" -a || echo "Nothing to update"
    - name: Push changes
      uses: ad-m/github-push-action@master
      with:
        github_token: ${{ secrets.GH_TOKEN }}
        branch: libtorrent1

  update-legacy:
    runs-on: ubuntu-latest
    needs: find-latest-release
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false # otherwise, the token used is the GITHUB_TOKEN, instead of your personal access token.
        fetch-depth: 0 # otherwise, there would be errors pushing refs to the destination repository.
        ref: legacy
    - name: Create local changes
      run: |
        [ ! -z "$QBT_LEGACY_VERSION" ] && [[ "$QBT_LEGACY_VERSION" != "null" ]] && sed -i 's/.*ARG QBITTORRENT_RELEASE=.*/ARG QBITTORRENT_RELEASE="'${QBT_LEGACY_VERSION}'"/' Dockerfile
      env:
        QBT_LEGACY_VERSION: ${{ needs.find-latest-release.outputs.qbt-legacy-version }}
    - name: Create local changes
      run: |
        [ ! -z "$QBT_REVISION" ] && [[ "$QBT_REVISION" != "null" ]] && sed -i 's/.*ARG QBITTORRENT_REVISION=.*/ARG QBITTORRENT_REVISION="'${QBT_REVISION}'"/' Dockerfile
      env:
        QBT_REVISION: ${{ needs.find-latest-release.outputs.qbt-legacy-revision }}
    - name: Commit files
      run: |
        git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git commit -m "Update to ${{ needs.find-latest-release.outputs.qbt-legacy-version }}-${{ needs.find-latest-release.outputs.qbt-legacy-revision }}" -a || echo "Nothing to update"
    - name: Push changes
      uses: ad-m/github-push-action@master
      with:
        github_token: ${{ secrets.GH_TOKEN }}
        branch: legacy
