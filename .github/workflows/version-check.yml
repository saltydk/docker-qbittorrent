name: version-check

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: read

concurrency:
  group: qbittorrent-version-check
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          ref: main
          token: ${{ secrets.GH_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.3.0

      - name: Resolve image inputs
        id: update
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/manage_builds.py update --write --github-output "$GITHUB_OUTPUT"

      - name: Summarize decisions
        env:
          REPORT: ${{ steps.update.outputs.report }}
        run: |
          {
            echo '## Image input decisions'
            echo
            jq . <<< "$REPORT"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit image inputs
        if: steps.update.outputs.changed == 'true'
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add Dockerfile.libtorrent1 Dockerfile.libtorrent2 Dockerfile.legacy
          git diff --cached --check
          git commit -m "build(images): refresh image inputs"
          git push origin HEAD:main
