name: version-check

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: read

concurrency:
  # Keep input commits from superseding an in-progress main push build.
  group: qbittorrent-build-refs/heads/main
  queue: max
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      source-sha: ${{ steps.source.outputs.source-sha }}
      rebuild: ${{ steps.update.outputs.rebuild }}
      rebuild-variants: ${{ steps.update.outputs.rebuild-variants }}
      waiting-for-base: ${{ steps.update.outputs.waiting-for-base }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          ref: main

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.3.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.3.0

      - name: Resolve image inputs
        id: update
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if python3 scripts/manage_builds.py update --write \
            --github-output "$GITHUB_OUTPUT" \
            --report update-report.json \
            --summary "$GITHUB_STEP_SUMMARY"; then
            exit 0
          else
            status=$?
            # Exit 4 means the inherited packages require a newer base image.
            [[ "$status" == "4" ]] || exit "$status"
            echo "::notice::Waiting for the scheduled base refresh. The next scheduled or manual version check will retry."
            echo "Waiting for the scheduled base refresh. The next scheduled or manual version check will retry." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Verify resolved inputs
        if: steps.update.outputs.waiting-for-base != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/manage_builds.py verify

      - name: Commit image inputs
        if: steps.update.outputs.changed == 'true'
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add Dockerfile.libtorrent1 Dockerfile.libtorrent2 Dockerfile.legacy packages/runtime/*.lock
          git diff --cached --check
          {
            echo 'build(images): refresh image inputs'
            echo
            python3 - <<'PY'
          import json
          from pathlib import Path
          from scripts.build_report import render_commit_body
          print(render_commit_body(json.loads(Path('update-report.json').read_text())), end='')
          PY
          } > "$RUNNER_TEMP/commit-message"
          git commit --cleanup=verbatim --file "$RUNNER_TEMP/commit-message"
          python3 scripts/push_inputs.py

      - name: Select committed source
        id: source
        run: echo "source-sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Upload update report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qbittorrent-update-report
          path: update-report.json
          if-no-files-found: error

  build:
    if: needs.update.outputs.rebuild == 'true'
    needs: update
    permissions:
      contents: read
      security-events: write
      issues: write
    uses: ./.github/workflows/build.yml
    with:
      source-sha: ${{ needs.update.outputs.source-sha }}
      variants: ${{ needs.update.outputs.rebuild-variants }}
      publish: true
      has-update-report: true
    secrets: inherit
