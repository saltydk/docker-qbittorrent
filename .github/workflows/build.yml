name: build

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - '*.md'
    branches:
      - 'libtorrent2'

permissions:
  contents: read

jobs:
  find-latest-version:
    runs-on: ubuntu-latest
    outputs:
      qbt-version: ${{ steps.set-latest-version.outputs.qbt-version }}
      qbt-release: ${{ steps.set-latest-version.outputs.qbt-release }}
    steps:
      - uses: actions/checkout@v7
      - id: set-latest-version
        run: |
          release=$(awk -F'"' '/^ARG QBITTORRENT_RELEASE=/{print $2}' Dockerfile)
          revision=$(awk -F'"' '/^ARG QBITTORRENT_REVISION=/{print $2}' Dockerfile)
          echo "qbt-version=${release}-${revision}" >> "$GITHUB_OUTPUT"
          echo "qbt-release=${release}" >> "$GITHUB_OUTPUT"

  docker:
    runs-on: ubuntu-latest
    needs: find-latest-version
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: saltydk/qbittorrent

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v7
        with:
          platforms: linux/amd64
          pull: true
          sbom: true
          push: true
          tags: |
            saltydk/qbittorrent:${{ needs.find-latest-version.outputs.qbt-version }}
            saltydk/qbittorrent:${{ needs.find-latest-version.outputs.qbt-release }}
            saltydk/qbittorrent:libtorrent2
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: sarisia/actions-status-discord@v1
        if: always()
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
