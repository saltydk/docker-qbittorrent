name: build

on:
  workflow_call:
    inputs:
      source-sha:
        description: Exact source revision to check out, label, select, test, and publish
        required: true
        type: string
      variants:
        description: JSON array of updater-selected variants
        required: false
        type: string
        default: ''
      has-update-report:
        description: The caller uploaded an update report
        type: boolean
        default: false
      publish:
        description: Publish accepted candidates
        required: false
        type: boolean
        default: false
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  # Updater-called builds must not wait on their parent updater's group.
  group: ${{ inputs.source-sha != '' && format('qbittorrent-called-build-{0}', github.run_id) || format('qbittorrent-build-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: saltydk/qbittorrent

jobs:
  static:
    runs-on: ubuntu-latest
    outputs:
      skip-build: ${{ steps.verify.outputs.skip-build }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.source-sha || github.event.pull_request.head.sha || github.sha }}

      - name: Run updater tests
        run: python3 -m unittest discover -s tests -v

      - name: Verify upstream artifact inputs
        id: verify
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          CALLED_SOURCE_SHA: ${{ inputs.source-sha }}
        run: >-
          python3 -m scripts.build_workflow verify
          --event-name "$EVENT_NAME"
          --called-source-sha "$CALLED_SOURCE_SHA"
          --github-output "$GITHUB_OUTPUT"
          --summary "$GITHUB_STEP_SUMMARY"

      - name: Check shell scripts
        run: |
          shellcheck scripts/test-image.sh
          shellcheck -s sh root/etc/cont-init.d/10-config root-legacy/etc/cont-init.d/10-config
          shellcheck -s bash root/etc/services.d/qbittorrent/run root-legacy/etc/services.d/qbittorrent/run

      - name: Check workflows
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: '-ignore "unexpected key .queue. for .concurrency. section"'


  prepare:
    runs-on: ubuntu-latest
    outputs:
      has-builds: ${{ steps.matrix.outputs.has-builds }}
      candidate-matrix: ${{ steps.matrix.outputs.candidate-matrix }}
      publish-matrix: ${{ steps.matrix.outputs.publish-matrix }}
      locks-sha: ${{ steps.locks.outputs.locks-sha }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.source-sha || github.event.pull_request.head.sha || github.sha }}

      - name: Select image variants
        id: matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ inputs.source-sha || github.event.pull_request.head.sha || github.sha }}
          CALLED_SOURCE_SHA: ${{ inputs.source-sha }}
          SELECTED_VARIANTS: ${{ inputs.variants }}
        run: >-
          python3 -m scripts.build_workflow matrix
          --event-name "$EVENT_NAME"
          --before-sha "$BEFORE_SHA"
          --base-sha "$BASE_SHA"
          --head-sha "$HEAD_SHA"
          --called-source-sha "$CALLED_SOURCE_SHA"
          --selected-variants-json "$SELECTED_VARIANTS"
          --github-output "$GITHUB_OUTPUT"

      - name: Compute lock-set digest
        id: locks
        run: >-
          python3 -m scripts.build_workflow locks
          --source-root .
          --github-output "$GITHUB_OUTPUT"

  test-candidate:
    needs:
      - static
      - prepare
    if: needs.prepare.outputs.has-builds == 'true' && needs.static.outputs.skip-build != 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.candidate-matrix) }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.source-sha || github.event.pull_request.head.sha || github.sha }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.3.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.3.0

      - name: Capture published baseline
        run: >-
          python3 scripts/build_report.py snapshot
          --repository "$GITHUB_REPOSITORY"
          --image "${{ matrix.variant }}"
          --platform "${{ matrix.platform }}"
          --stage runtime
          --reference "${IMAGE}:${{ matrix.variant }}"
          --source-sha "${{ inputs.source-sha || github.event.pull_request.head.sha || github.sha }}"
          --output baseline.json

      - name: Build candidate
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          platforms: ${{ matrix.platform }}
          pull: true
          tags: local/qbittorrent:${{ matrix.variant }}-${{ matrix.platform_slug }}-${{ inputs.source-sha || github.event.pull_request.head.sha || github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ inputs.source-sha || github.event.pull_request.head.sha || github.sha }}
            io.saltydk.image-inputs.sha256=${{ matrix.input_sha }}
          build-args: |
            APK_LOCKS_SHA256=${{ needs.prepare.outputs.locks-sha }}
            IMAGE_INPUTS_SHA256=${{ matrix.input_sha }}
          cache-from: type=gha,scope=qbittorrent-${{ matrix.variant }}-${{ matrix.platform_slug }}
          cache-to: type=gha,scope=qbittorrent-${{ matrix.variant }}-${{ matrix.platform_slug }},mode=max

      - name: Test candidate
        run: >-
          scripts/test-image.sh
          "local/qbittorrent:${{ matrix.variant }}-${{ matrix.platform_slug }}-${{ inputs.source-sha || github.event.pull_request.head.sha || github.sha }}"
          "${{ matrix.platform }}"
          "${{ matrix.architecture }}"
          "${{ matrix.variant }}"
          "${{ matrix.qbittorrent_version }}"
          "${{ matrix.libtorrent_prefix }}"
          "${{ matrix.config_profile }}"

      - name: Verify candidate package inventory
        if: ${{ !cancelled() }}
        run: >-
          python3 scripts/build_report.py verify
          --repository "$GITHUB_REPOSITORY"
          --image "${{ matrix.variant }}"
          --platform "${{ matrix.platform }}"
          --stage runtime
          --candidate "local/qbittorrent:${{ matrix.variant }}-${{ matrix.platform_slug }}-${{ inputs.source-sha || github.event.pull_request.head.sha || github.sha }}"
          --lock "packages/runtime/${{ matrix.architecture }}.lock"
          --baseline baseline.json
          --source-sha "${{ inputs.source-sha || github.event.pull_request.head.sha || github.sha }}"
          --output "candidate-${{ matrix.variant }}-${{ matrix.platform_slug }}.json"

      - name: Upload candidate report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qbittorrent-candidate-${{ matrix.variant }}-${{ matrix.platform_slug }}
          path: candidate-${{ matrix.variant }}-${{ matrix.platform_slug }}.json
          if-no-files-found: error

      - name: Scan candidate with shared container tooling
        id: security
        if: ${{ !cancelled() }}
        uses: saltyorg/github-actions/container-scan@v1.3.2
        with:
          image: local/qbittorrent:${{ matrix.variant }}-${{ matrix.platform_slug }}-${{ inputs.source-sha || github.event.pull_request.head.sha || github.sha }}
          name: ${{ matrix.variant }}
          platform: ${{ matrix.platform }}
          output-directory: security/${{ matrix.variant }}-${{ matrix.platform_slug }}
          scout-enabled: ${{ github.event_name != 'pull_request' }}
          enforce-kev: ${{ github.event_name != 'pull_request' }}
          dockerhub-user: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Retain candidate security reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: docker-qbittorrent-security-candidate-${{ matrix.variant }}-${{ matrix.platform_slug }}
          path: security/${{ matrix.variant }}-${{ matrix.platform_slug }}
          if-no-files-found: warn

  publish:
    concurrency:
      group: docker-qbittorrent-publication
      queue: max
      cancel-in-progress: false
    needs:
      - prepare
      - test-candidate
    if: >-
      always() &&
      ((inputs.source-sha != '' && inputs.publish) || (inputs.source-sha == '' && github.event_name != 'pull_request')) &&
      needs.prepare.outputs.has-builds == 'true' &&
      needs.test-candidate.result == 'success'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.publish-matrix) }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.source-sha || github.event.pull_request.head.sha || github.sha }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.3.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.3.0

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.IMAGE }}
          labels: |
            org.opencontainers.image.revision=${{ inputs.source-sha || github.event.pull_request.head.sha || github.sha }}
            io.saltydk.image-inputs.sha256=${{ matrix.input_sha }}

      - name: Login to Docker Hub
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Select publication from current registry revisions
        id: source-guard
        env:
          SOURCE_SHA: ${{ inputs.source-sha || github.event.pull_request.head.sha || github.sha }}
          SOURCE_REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PUBLICATION_TAGS: ${{ toJSON(matrix.tags) }}
        run: >-
          python3 -m scripts.publication_guard
          --source-sha "$SOURCE_SHA"
          --source-ref "$SOURCE_REF"
          --default-branch "$DEFAULT_BRANCH"
          --tags-json "$PUBLICATION_TAGS"
          --github-output "$GITHUB_OUTPUT"

      - name: Publish image
        id: docker-build
        if: steps.source-guard.outputs.eligible == 'true'
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          sbom: true
          tags: ${{ join(matrix.tags, ',') }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APK_LOCKS_SHA256=${{ needs.prepare.outputs.locks-sha }}
            IMAGE_INPUTS_SHA256=${{ matrix.input_sha }}
          cache-from: |
            type=gha,scope=qbittorrent-${{ matrix.variant }}-amd64
            type=gha,scope=qbittorrent-${{ matrix.variant }}-arm64
          cache-to: type=gha,scope=qbittorrent-${{ matrix.variant }}-publish,mode=max

      - name: Record published tags
        id: record
        if: steps.source-guard.outputs.eligible == 'true'
        env:
          PUBLISHED_DIGEST: ${{ steps.docker-build.outputs.digest }}
          TAGS: ${{ toJSON(matrix.tags) }}
          VARIANT: ${{ matrix.variant }}
        run: >-
          python3 -m scripts.publication record
          --variant "$VARIANT"
          --digest "$PUBLISHED_DIGEST"
          --tags-json "$TAGS"

      - name: Capture publication outcomes
        if: always()
        env:
          VARIANT: ${{ matrix.variant }}
          SOURCE_GUARD_RESULT: ${{ steps.source-guard.outcome }}
          ELIGIBLE: ${{ steps.source-guard.outputs.eligible }}
          BUILD_RESULT: ${{ steps.docker-build.outcome }}
          PUBLISHED_DIGEST: ${{ steps.docker-build.outputs.digest }}
          TAGS: ${{ toJSON(matrix.tags) }}
          RECORD_RESULT: ${{ steps.record.outcome }}
        run: >-
          python3 -m scripts.publication outcomes
          --variant "$VARIANT"
          --source-guard "$SOURCE_GUARD_RESULT"
          --eligible "$ELIGIBLE"
          --build-result "$BUILD_RESULT"
          --digest "$PUBLISHED_DIGEST"
          --tags-json "$TAGS"
          --record-result "$RECORD_RESULT"

      - name: Upload published tags
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qbittorrent-published-${{ matrix.variant }}
          path: |
            publication-${{ matrix.variant }}-outcomes.txt
            published-${{ matrix.variant }}.txt
          if-no-files-found: error

  acceptance:
    outputs:
      has-publications: ${{ steps.report.outputs.has-publications }}
      published-variants: ${{ steps.report.outputs.published-variants }}
      published-images: ${{ steps.report.outputs.published-images }}
    if: >-
      always() &&
      (needs.static.outputs.skip-build != 'true' ||
       needs.static.result != 'success' || needs.prepare.result != 'success')
    needs:
      - static
      - prepare
      - test-candidate
      - publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.source-sha || github.event.pull_request.head.sha || github.sha }}

      - name: Download candidate reports
        if: needs.prepare.outputs.has-builds == 'true'
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: qbittorrent-candidate-*
          path: candidate-reports
          merge-multiple: true

      - name: Download update report
        if: inputs.has-update-report
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: qbittorrent-update-report
          path: update-reports

      - name: Download publication records
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: qbittorrent-published-*
          path: published-tags
          merge-multiple: true

      - name: Write grouped build report
        id: report
        env:
          STATIC_RESULT: ${{ needs.static.result }}
          PREPARE_RESULT: ${{ needs.prepare.result }}
          TEST_RESULT: ${{ needs.test-candidate.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          HAS_BUILDS: ${{ needs.prepare.outputs.has-builds }}
          SHOULD_PUBLISH: ${{ (inputs.source-sha != '' && inputs.publish) || (inputs.source-sha == '' && github.event_name != 'pull_request') }}
          SOURCE_SHA: ${{ inputs.source-sha || github.event.pull_request.head.sha || github.sha }}
          PUBLISH_MATRIX: ${{ needs.prepare.outputs.publish-matrix }}
        run: >-
          python3 -m scripts.publication report
          --repository "$GITHUB_REPOSITORY"
          --source-sha "$SOURCE_SHA"
          --static-result "$STATIC_RESULT"
          --prepare-result "$PREPARE_RESULT"
          --test-result "$TEST_RESULT"
          --publish-result "$PUBLISH_RESULT"
          --has-builds "$HAS_BUILDS"
          --should-publish "$SHOULD_PUBLISH"
          --publish-matrix-json "$PUBLISH_MATRIX"
          --github-output "$GITHUB_OUTPUT"
          --summary "$GITHUB_STEP_SUMMARY"
          --output build-report.json

      - name: Upload grouped build report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qbittorrent-build-report-${{ inputs.source-sha || github.event.pull_request.head.sha || github.sha }}
          path: build-report.json
          if-no-files-found: error

      - name: Write notification details
        if: always() && needs.prepare.outputs.has-builds == 'true' && (needs.publish.result != 'success' || steps.report.outputs.has-publications == 'true')
        env:
          PUBLISH_MATRIX: ${{ needs.prepare.outputs.publish-matrix }}
          PUBLISHED_VARIANTS: ${{ steps.report.outputs.published-variants }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
        run: >-
          python3 -m scripts.notification
          --publish-matrix-json "$PUBLISH_MATRIX"
          --published-variants-json "$PUBLISHED_VARIANTS"
          --publish-result "$PUBLISH_RESULT"

      - name: Upload notification details
        if: always() && needs.prepare.outputs.has-builds == 'true' && (needs.publish.result != 'success' || steps.report.outputs.has-publications == 'true')
        uses: actions/upload-artifact@v7
        with:
          name: qbittorrent-notification-${{ github.run_attempt }}
          path: notification.json
          if-no-files-found: error

      - name: Verify required jobs
        env:
          STATIC_RESULT: ${{ needs.static.result }}
          PREPARE_RESULT: ${{ needs.prepare.result }}
          HAS_BUILDS: ${{ needs.prepare.outputs.has-builds }}
          TEST_RESULT: ${{ needs.test-candidate.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          SHOULD_PUBLISH: ${{ (inputs.source-sha != '' && inputs.publish) || (inputs.source-sha == '' && github.event_name != 'pull_request') }}
        run: >-
          python3 -m scripts.build_workflow requirements
          --static-result "$STATIC_RESULT"
          --prepare-result "$PREPARE_RESULT"
          --has-builds "$HAS_BUILDS"
          --test-result "$TEST_RESULT"
          --publish-result "$PUBLISH_RESULT"
          --should-publish "$SHOULD_PUBLISH"

  published-security:
    needs:
      - publish
      - acceptance
    if: ${{ !cancelled() && needs.publish.result == 'success' && needs.acceptance.outputs.has-publications == 'true' }}
    permissions:
      contents: read
      security-events: write
      issues: write
    uses: ./.github/workflows/security-scan.yml
    with:
      source-sha: ${{ inputs.source-sha || github.event.pull_request.head.sha || github.sha }}
      published-images: ${{ needs.acceptance.outputs.published-images }}
    secrets: inherit
